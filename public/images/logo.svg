<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 52" width="230" height="52">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a73e8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d47a1;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Icon circle -->
  <circle cx="26" cy="26" r="24" fill="url(#grad)" />

  <!-- Heart -->
  <path d="M26 36 C26 36 14 28 14 20 C14 16 17 13 20.5 13 C22.8 13 25 14.5 26 16.5 C27 14.5 29.2 13 31.5 13 C35 13 38 16 38 20 C38 28 26 36 26 36Z"
        fill="white" opacity="0.95"/>

  <!-- Person dot -->
  <circle cx="26" cy="20" r="2.5" fill="url(#grad)"/>
  <!-- Person body arc -->
  <path d="M21.5 28 Q21.5 24 26 24 Q30.5 24 30.5 28"
        fill="none" stroke="url(#grad)" stroke-width="2" stroke-linecap="round"/>

  <!-- "Care Entry" text -->
  <text x="60" y="23"
        font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
        font-size="20" font-weight="800" fill="#1a73e8" letter-spacing="0.3">Care Entry</text>

  <!-- "ケア・エントリー" subtitle -->
  <text x="61" y="40"
        font-family="'Hiragino Kaku Gothic ProN','Meiryo',sans-serif"
        font-size="11" font-weight="400" fill="#555" letter-spacing="0.5">ケア・エントリー</text>
</svg>
